name: Application security

on:
  pull_request:
    paths:
      - "server/**"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "database/**"
      - "docs/**"
      - ".env.example"
      - "README.md"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "render*.yaml"
      - "public/_redirects"
      - ".github/workflows/application-security.yml"
  push:
    branches: [master, main, "codex/**"]
    paths:
      - "server/**"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "database/**"
      - "docs/**"
      - ".env.example"
      - "README.md"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "render*.yaml"
      - "public/_redirects"
      - ".github/workflows/application-security.yml"

permissions:
  contents: read

jobs:
  typecheck-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.0
          cache: npm
      - run: npm ci
      - run: npm run check
