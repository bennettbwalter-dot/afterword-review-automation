name: Database security

on:
  pull_request:
    paths:
      - "database/**"
      - "server/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/database-security.yml"
  push:
    branches: [master, main, "codex/**"]
    paths:
      - "database/**"
      - "server/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/database-security.yml"

permissions:
  contents: read

jobs:
  postgres-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.13-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Create least-privilege group roles and database
        run: |
          psql --dbname postgres --set ON_ERROR_STOP=1 <<'SQL'
          create role afterword_migration_owner nologin nobypassrls;
          create role afterword_runtime nologin nobypassrls;
          create role afterword_ingress nologin nobypassrls;
          create role afterword_worker nologin nobypassrls;
          create role afterword_ops nologin nobypassrls;
          create role afterword_auth nologin nobypassrls;
          SQL
          createdb --owner afterword_migration_owner afterword_test
      - name: Prove migrator safety and idempotency
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run db:test:migrator
      - name: Generate the target-bound migration approval
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/afterword_test
        run: |
          node --import tsx --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          import { migrationChecksum } from "./scripts/migration-checksum.ts";
          import { migrationTargetFingerprint } from "./scripts/migration-policy.ts";
          const file = "019_provider_independent_security.sql";
          const manifest = {
            targetSha256: migrationTargetFingerprint(process.env.MIGRATION_DATABASE_URL),
            evidenceId: "github-database-security",
            migrations: {
              [file]: migrationChecksum(readFileSync(`database/migrations/${file}`, "utf8")),
            },
          };
          appendFileSync(process.env.GITHUB_ENV, `MIGRATION_APPROVAL_MANIFEST=${JSON.stringify(manifest)}\n`);
          NODE
      - name: Apply reviewed migrations through the real migrator
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/afterword_test
        run: npm run db:migrate
      - name: Prove every database-security contract
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/afterword_test
        run: npm run db:test:isolation
      - name: Prove pooled and concurrent context isolation
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/afterword_test
        run: npm run db:test:concurrency
